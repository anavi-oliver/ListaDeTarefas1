spring.application.name=prova1

# hibernate cria a tabela sozinho com o "ddl-auto=update", sem precisar rodar o script na mão
spring.jpa.hibernate.ddl-auto=update
# tabela gerada automaticamente com o ma;peamento da classe Tarefa

spring.datasource.url=jdbc:sqlite:tarefas.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true
